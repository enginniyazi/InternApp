version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stajapp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-internapp}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: stajapp_mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: stajapp_server
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-internapp}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - mailpit

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: stajapp_client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  postgres_data:
