# Render.com Dağıtım Yapılandırması
services:
  - type: web
    name: stajapp-server
    env: node
    region: frankfurt
    plan: free
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
